<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super To-Do List</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1c1f27" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <button id="boton-menu-movil" class="boton-menu-movil" type="button" aria-label="Abrir el menú" aria-controls="sidebar" title="Menú">☰</button>
  <div id="velo-sidebar" class="velo-sidebar" hidden></div>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar" aria-label="Menú de módulos">
      <div class="sidebar-marca">
        <h1>STDL</h1>
        <span id="version-app" class="version-app"></span>
        <button id="boton-compactar-sidebar" class="boton-compactar" type="button" aria-label="Compactar el menú" title="Compactar o expandir el menú">«</button>
      </div>
      <div class="sidebar-estado">
        <div id="indicador-sync" class="indicador-sync" role="status" aria-live="polite"></div>
        <button id="boton-sync" type="button" title="Verifica contra Drive y sube lo pendiente"><span aria-hidden="true">🔄</span><span class="texto-sidebar"> Sincronizar ahora</span></button>
      </div>
      <nav id="nav-vistas" class="nav-vistas" aria-label="Módulos"></nav>
      <div class="sidebar-acciones">
        <button id="boton-deshacer" type="button" title="Deshacer el último cambio (Ctrl+Z)" aria-label="Deshacer" disabled>↩️</button>
        <button id="boton-rehacer" type="button" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer" disabled>↪️</button>
      </div>
      <button id="boton-completar-carga" class="boton-completar-carga" type="button" title="Tareas que quedaron con solo el nombre" hidden></button>
      <button id="boton-nueva-tarea" class="boton-nueva-tarea" type="button" title="Nueva tarea (tecla N)" aria-label="Nueva tarea" hidden><span aria-hidden="true">＋</span><span class="texto-sidebar"> Nueva tarea</span></button>
    </aside>
    <main id="vista" class="vista"></main>
  </div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
