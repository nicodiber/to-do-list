<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super To-Do List</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1c1f27" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-fila">
      <h1>STDL <span id="version-app" class="version-app"></span></h1>
      <button id="boton-nueva-tarea" class="boton-mas" type="button" title="Nueva tarea (tecla N)" aria-label="Nueva tarea" hidden>＋</button>
      <div class="acciones-datos">
        <button id="boton-completar-carga" type="button" title="Tareas que quedaron con solo el nombre" hidden></button>
        <div id="indicador-sync" class="indicador-sync" role="status" aria-live="polite"></div>
        <button id="boton-sync" type="button" title="Verifica contra Drive y sube lo pendiente">🔄 Sincronizar ahora</button>
        <button id="boton-deshacer" type="button" title="Deshacer el último cambio (Ctrl+Z)" aria-label="Deshacer" disabled>↩️</button>
        <button id="boton-rehacer" type="button" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer" disabled>↪️</button>
        <button id="boton-atajos" type="button" title="Atajos de teclado (tecla ?)" aria-label="Atajos de teclado">⌨️</button>
      </div>
    </div>
    <nav id="nav-vistas" class="nav-vistas"></nav>
    <div id="banner-sync" class="banner-sync" hidden></div>
    <div id="panel-avisos" class="panel-avisos" hidden></div>
  </header>
  <main id="vista" class="vista"></main>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
